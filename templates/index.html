<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Weather Forecast</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=7">
</head>
<body>

    <div class="phone-frame">

        <!-- Top Header & Search -->
        <header class="app-header">
            <div class="header-top-row">
                <div class="header-location">
                    <div class="location-title">
                        <svg class="pin-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <h2 id="cityName">Search City</h2>
                    </div>
                    <p id="dateLine" class="date-subtitle">--</p>
                </div>

                <!-- Theme Toggle Button -->
                <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle dark mode">
                    <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>

            <div class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city..."
                    autocomplete="off"
                >
                <button id="searchButton" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </header>

        <p id="error" class="error-text"></p>

        <main class="views-container">

            <!-- ============ HOME VIEW ============ -->
            <section id="view-home" class="view active">

                <!-- Hero Sunny Glowing Card -->
                <div class="hero-sun-card">
                    <div class="sun-glow-sphere"></div>

                    <div id="weatherIcon" class="hero-icon-container">
                        <div class="fallback-sun">
                            <span class="core"></span>
                            <span class="ray"></span>
                        </div>
                    </div>

                    <div class="temp-display">
                        <span class="temp-number" id="temperature">--</span><span class="temp-unit">°</span>
                    </div>

                    <p class="condition-badge" id="condition">Loading...</p>
                </div>

                <!-- 2x2 Clean Metrics Grid -->
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-meta">
                            <div class="icon-circle wind-tint">💨</div>
                            <small>Wind</small>
                        </div>
                        <span id="wind" class="stat-value">-- m/s</span>
                    </div>

                    <div class="stat-card">
                        <div class="stat-meta">
                            <div class="icon-circle press-tint">⏲️</div>
                            <small>Pressure</small>
                        </div>
                        <span id="pressure" class="stat-value">-- hPa</span>
                    </div>

                    <div class="stat-card">
                        <div class="stat-meta">
                            <div class="icon-circle humid-tint">💧</div>
                            <small>Humidity</small>
                        </div>
                        <span id="humidity" class="stat-value">--%</span>
                    </div>

                    <div class="stat-card">
                        <div class="stat-meta">
                            <div class="icon-circle feels-tint">🌡️</div>
                            <small>Feels Like</small>
                        </div>
                        <span id="feels" class="stat-value">--°</span>
                    </div>
                </div>

                <!-- Today's Hourly Forecast -->
                <div class="content-group">
                    <div class="group-header">
                        <h3>Today</h3>
                    </div>
                    <div class="hourly-strip" id="hourlyStrip"></div>
                </div>

                <!-- Upcoming 5 Days -->
                <div class="content-group">
                    <div class="group-header">
                        <h3>Upcoming Days</h3>
                    </div>
                    <div class="upcoming-list" id="upcomingList"></div>
                </div>

            </section>

            <!-- ============ FORECAST VIEW ============ -->
            <section id="view-forecast" class="view">
                <div class="content-group">
                    <div class="group-header">
                        <h3>5-Day Forecast</h3>
                    </div>
                    <p class="section-subtext">Tap any day for full hourly details</p>
                    <div class="forecast-list" id="forecastList"></div>
                </div>
            </section>

            <!-- ============ STATISTICS VIEW ============ -->
            <section id="view-statistics" class="view">
                <div class="content-group">
                    <div class="group-header">
                        <h3>Temperature Trends</h3>
                    </div>
                    <div class="chart-card" id="tempChart"></div>
                </div>

                <div class="content-group">
                    <div class="group-header">
                        <h3>Precipitation</h3>
                    </div>
                    <div class="chart-card" id="precipChart"></div>
                </div>

                <div class="content-group">
                    <div class="group-header">
                        <h3>Wind Speed</h3>
                    </div>
                    <div class="chart-card" id="windChart"></div>
                </div>
            </section>

            <!-- ============ DAILY UPDATES VIEW ============ -->
            <section id="view-updates" class="view">
                <div class="content-group">
                    <div class="group-header">
                        <h3>Daily Updates</h3>
                    </div>
                    <div class="updates-list" id="updatesList"></div>
                </div>
            </section>

        </main>

        <!-- App Footer -->
        <footer class="app-footer">
            <p>© 2026 xrxeal. All rights reserved.</p>
        </footer>

        <!-- Rounded Floating Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="home">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Home</span>
            </button>
            <button class="nav-btn" data-view="forecast">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>Forecast</span>
            </button>
            <button class="nav-btn" data-view="statistics">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                <span>Stats</span>
            </button>
            <button class="nav-btn" data-view="updates">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span>Updates</span>
            </button>
        </nav>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
